# PgBouncer HBA configuration
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Loopback only — trust for the pooler's own host-local connections
# (auth_query backend lookup / admin console on 127.0.0.1). PgBouncer's
# auth_query runs against the REAL postgres (host=postgres in pgbouncer.ini),
# which authenticates the pooler via userlist.txt + SCRAM against its own
# pg_hba — this file only gates CLIENT -> pgbouncer connections.
host    all             postgres        127.0.0.1/32            trust
host    all             postgres        ::1/128                 trust

# Everything else — including every docker container on pgforge-net
# (172.16/12) — requires SCRAM-SHA-256 password auth. Previously the
# 172.16.0.0/12 trust line let ANY tenant app container connect as
# user=postgres with no password = superuser over all tenant DBs and
# Forge metadata.
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
