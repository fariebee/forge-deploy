apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Jump from a log line carrying a trace_id to the trace in Tempo.
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '(?:trace_id|traceID|traceId)"?[:=]"?(\w+)'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span, pivot to the matching container's logs in Loki, keyed on
      # the compose_project label that Alloy stamps on every log stream.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        tags:
          - key: service.name
            value: compose_project
      nodeGraph:
        enabled: true
