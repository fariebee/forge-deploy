# Tempo single-binary config for the Forge monitoring profile.
# Receives traces over OTLP (gRPC 4317 / HTTP 4318) from Grafana Alloy, which
# in turn collects them from the Forge backend and any instrumented apps.
# Trace blocks live on a local volume (single-node install); query API on 3200
# for the Grafana Tempo datasource. Run with -config.expand-env=true so
# MONITORING_TRACES_RETENTION expands from the container env (compose default
# 72h). expand-env treats every dollar-brace token as an env var, so this file
# must not contain a literal one in a comment.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: ${MONITORING_TRACES_RETENTION}

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
